 }

const codeLines=[
 'def render(upper, dx, dy):    x = np.array([0.52, 0.48, 0.29], np.float32)     # luminance',
 'for row in range(height):    shade = sample(x, y)    mask = iris > pupil     return glyphs[row]',
 'if 0.10 < glow < 0.72:    color = (amber, ivory, cyan)    canvas.fillText(char, x, y)',
 'texture = np.sin(theta * 31.0 + radius * 0.26)   # contour / shadow / reflect',
 'while frame < duration:    draw_eye(t)    light = smoothstep(.04, .98, intensity)',
 'pixels[y, x] = np.clip(source * exposure + grain, 0, 255)    // vision / memory',
 'const iris = radialGradient(cx, cy, pupil, limbus);  let luminance = dot(rgb, weights);'
];
function buildCodeBackground(){

 bg.fillStyle='#030504';bg.fillRect(0,0,W,H);

 bg.font=`500 ${size}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 bg.textAlign='left';bg.textBaseline='middle';
 const rows=Math.ceil(H/lineH)+1;
 for(let row=0;row<rows;row++){
   const y=row*lineH+3,seed=Math.floor(rand(row,20)*codeLines.length);
   const s=(codeLines[seed]+'   '+codeLines[(seed+3)%codeLines.length]+'   '+codeLines[(seed+5)%codeLines.length]);
   const shift=-rand(row,18)*size*22;
   const zone=Math.abs(y-H*.50)/H;
   bg.globalAlpha=zone<.30?.22:.36;
   bg.fillStyle=row%6===0?'#8da7a2':row%4===0?'#b26a48':'#8a7770';
   bg.fillText(s,shift,y);
   if(row%5===0){
     bg.globalAlpha=.11;bg.fillStyle='#e5ae82';bg.fillText(s,shift+size*.18,y+1);

function setup(){

   stars.push({x:rand(i,1)*W,y:rand(i,2)*H,r:.3+rand(i,3)*1.0,a:.15+rand(i,4)*.45,phase:rand(i,5)*6.28});

}
function glyph(c,r,luma){
 const mixKey=rand(c+18,r+41);
 const bright='@#MW80QBX%';
 const medium='0A8B37ΣπψΩ<>/%&$#';
 const dim='1|/\\(){}=+*;:·.-';
 let set=(luma>.67)?bright:(luma>.34)?medium:dim;
 return set[Math.floor(mixKey*set.length)];
}
function sampleFrom(data,sx,sy){
 let x=sx|0,y=sy|0;

function apertureHalfHeight(sx){

}
function sample(sx,sy,gaze,vertical){
 if(Math.abs(gaze)+Math.abs(vertical)<.01)return sampleFrom(pixel,sx,sy);

function gazeAt(t){

 if(t<3.03)return 62+drift;
 if(t<3.29)return mix(62,-78,ease((t-3.03)/.26))+drift;
 if(t<3.54)return mix(-78,-68,ease((t-3.29)/.25))+drift;

function lidBounds(sx,openness){

     if(openness<.995){
       const [top,bottom]=lidBounds(sx,openness);
       openAlpha=smooth(-6,5,sy-top)*smooth(-6,5,bottom-sy);
       if(openAlpha<.98 && Math.abs(sy-440)<apertureHalfHeight(sx) && rand(c,r,85)>.22){
         ctx.globalAlpha=(1-openAlpha)*(1-openness)*(.16+.22*rand(c,r,86))*eyeFading;
         ctx.fillStyle=sy<440?'#ab6966':'#91605d';
         ctx.fillText(glyph(c,r,.35),x,y);
       }
       if(openAlpha<.01)continue;
     }
     const sample0=sample(sx,sy,gaze,gazeY);
     if(!sample0 || sample0[3]<30)continue;
     const [rr,gg,bb,aa]=sample0;
     const alpha=aa/255;
     const luma=(.2126*rr+.7152*gg+.0722*bb)/255;
     const rnd=rand(c,r,7);
     const revealLine=smooth(.02,1.05,t+((c-COLS*.5)/COLS)*.12 + .1*(rnd-.5));
     const factor=alpha*(.78 +.22*luma)*revealLine*eyeFading*openAlpha;
     if(factor<.07 || rand(c,r,9)>(.08+.94*factor))continue;
     const colorR=Math.round(mix(rr,Math.min(255,rr+29),luma*.1));
     const colorG=Math.round(gg);const colorB=Math.round(bb);
     ctx.globalAlpha=clamp(factor*.95,0,1);
     ctx.fillStyle=`rgb(${colorR},${colorG},${colorB})`;
     // only brighter bits glow, keeping the glyph shapes sharp
     if(luma>.55 && rand(c,r,4)>.84){ctx.shadowColor=`rgba(${rr},${gg},${bb},.40)`;ctx.shadowBlur=4}else{ctx.shadowBlur=0}
     ctx.fillText(glyph(c,r,luma),x,y);
   }
 }
 ctx.shadowBlur=0;ctx.globalAlpha=1;
 drawClosedLid(openness,zoom);
 // tiny warm iris inner rim persists briefly as the pupil fills screen
 if(t>9.1&&t<11.8){
   const portal=smooth(9.1,10.9,t)*(1-smooth(10.9,11.8,t));
   const gr=ctx.createRadialGradient(W/2,H/2,2,W/2,H/2,Math.min(W,H)*.4);
   gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.85,`rgba(80,18,39,${portal*.06})`);gr.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 }
}
function heartVal(x,y){let a=x*x+y*y-1;return a*a*a-x*x*y*y*y}
function drawHeart(t){
 const melt=smooth(14.05,16.75,t);
 if(melt>=1)return;
 const gaze=gazeAt(t),gazeY=gazeYAt(t),zoom=mix(1,9.6,ease(smooth(6.35,10.9,t)));
 const hx=offsetX+(CX+gaze*zoom)/REF_W*drawW;
 const hy=offsetY+(CY+gazeY*zoom)/REF_H*drawH+Math.min(13,zoom*1.8);
 const pulse=1+.018*Math.sin((t-11.7)*3.0)*smooth(11.5,12.5,t);
 const size=Math.min(53*zoom*drawW/REF_W,Math.min(W,H)*.33)*pulse;
 const openness=opennessAt(t);
 const heartReveal=smooth(.03,1.05,t);
 // The heart shares the pupil's origin and scale from the very first frame.
 // Only its individual code characters glow; there is no smooth heart silhouette.
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${fontSize*1.05}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 for(let r=0;r<ROWS;r++){
   const y=offsetY+(r+.5)*cellH;
   const yy=(hy-y)/size;
   if(Math.abs(yy)>1.36)continue;
   for(let c=0;c<COLS;c++){
     const x=offsetX+(c+.5)*cellW;
     const xx=(x-hx)/size;
     if(Math.abs(xx)>1.2)continue;
     const f=heartVal(xx,yy);
     if(f>0)continue;
     if(openness<.995){
       const sx=CX+((x-offsetX)/drawW*REF_W-CX)/zoom;
       const sy=CY+((y-offsetY)/drawH*REF_H-CY)/zoom;
       const [top,bottom]=lidBounds(sx,openness);
       if(sy<top+2||sy>bottom-2)continue;
     }
     const edge=clamp(-f*32,0,1);
     const highlight=Math.exp(-((xx+.42)**2/.09 + (yy-.42)**2/.12));
     const soft=Math.exp(-((xx+.1)**2/.8+(yy-.25)**2/.8));
     const stripe=Math.sin((xx+yy)*16)*.04;
     const lum=clamp(.42 +.30*(yy+.9)/2.2 + .35*highlight+.14*soft+stripe);
     const R=255, G=Math.round(mix(30,191,highlight*.77 +.19*soft)), B=Math.round(mix(68,180,highlight*.64+.13*soft));
     // Lower fragments soften, stretch, and fall before the upper edge follows.
     const phase=.06+.17*rand(c,r,33)+.10*yy;
     const release=smooth(phase,phase+.50,melt);
     const alp=clamp((.65+.34*edge)*(.82+.18*rand(c,r,27)))*(1-smooth(.36,1,release))*heartReveal;
     if(rand(c,r,19)>.27+.73*alp)continue;
     ctx.fillStyle=`rgb(${R},${G},${B})`;ctx.globalAlpha=alp;
     if(highlight>.32|| (edge<.65&&rand(c,r,1)>.6)){
       ctx.shadowBlur=7;ctx.shadowColor='rgba(255,67,112,.78)';
     }else ctx.shadowBlur=0;
     const chars= lum>.67?'@#MW880$':lum>.5?'8BXΣπΩ%&0': '0A4/<>+*=';
     const ch=chars[(rand(c,r,41)*chars.length)|0];
     const drip=release*release*(40+rand(c,r,57)*Math.min(220,H*.30));
     const sway=Math.sin(t*5.0+c*.41)*release*4;
     ctx.fillText(ch,x+sway,y+drip);
     if(release>.12&&release<.9&&rand(c,r,60)>.54){
       ctx.shadowBlur=0;ctx.fillStyle='#ef6f83';
       for(let tail=1;tail<=3;tail++){
         ctx.globalAlpha=alp*(.20/tail);
         ctx.fillText(tail===1?'|':':',x+sway,y+drip-tail*cellH*.9);
       }
     }
   }
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 // A few glints, also composed of terminal characters.
 const glint=smooth(12.0,12.8,t);
 if(glint>.02){
   const glints=[[-.42,.44,'+'],[.34,.34,'×'],[-.57,-.1,'·'],[.54,-.36,'*']];
   for(let i=0;i<glints.length;i++){
     const [gx,gy,s]=glints[i];
     const twinkle=(.52+.48*Math.sin(3.9*t+i*1.7))*glint*(1-melt);
     ctx.fillStyle=`rgba(255,219,228,${twinkle*.86})`;
     ctx.font=`700 ${fontSize*1.5}px monospace`;
     ctx.shadowBlur=9;ctx.shadowColor='rgba(255,120,170,.75)';
     ctx.fillText(s,hx+gx*size*1.4,hy+gy*size*1.6);
   }
   ctx.shadowBlur=0;
 }
}
function buildMessageMasks(){
 const narrow=W<560,step=narrow?3.7:4.4;
 const quiet=narrow?26:40,large=narrow?64:88;
 const specs=narrow?[
   {text:'You asked me where',y:H*.5-68,start:15.7,size:quiet,kind:'quiet'},
   {text:'I disappeared to…',y:H*.5-35,start:16.35,size:quiet,kind:'quiet'},
   {text:'I’m here.',y:H*.5+47,start:18.2,size:large,kind:'arrival'}
 ]:[
   {text:'You asked me where I disappeared to…',y:H*.5-47,start:15.7,size:quiet,kind:'quiet'},
   {text:'I’m here.',y:H*.5+44,start:18.2,size:large,kind:'arrival'}
 ];
 const mask=document.createElement('canvas'),blur=document.createElement('canvas');
 mask.width=blur.width=W;mask.height=blur.height=H;
 const m=mask.getContext('2d',{willReadFrequently:true}),b=blur.getContext('2d',{willReadFrequently:true});
 messageParts=[];
 for(const spec of specs){
   m.clearRect(0,0,W,H);
   let size=spec.size;
   do{m.font=`${spec.kind==='arrival'?'italic 700':'600'} ${size}px ${spec.kind==='arrival'?'Georgia,"Times New Roman",serif':'ui-sans-serif,system-ui,-apple-system,sans-serif'}`;
     if(m.measureText(spec.text).width<W-32)break;
     size--;
   }while(size>18);
   const width=m.measureText(spec.text).width;
   m.textAlign='center';m.textBaseline='middle';
   m.lineWidth=step*.42;m.lineJoin='round';m.strokeStyle='#fff';m.fillStyle='#fff';
   m.strokeText(spec.text,W/2,spec.y);m.fillText(spec.text,W/2,spec.y);
   const core=m.getImageData(0,0,W,H).data;
   b.clearRect(0,0,W,H);b.filter=spec.kind==='arrival'?'blur(15px)':'blur(7px)';
   b.drawImage(mask,0,0);b.filter='none';
   const halo=b.getImageData(0,0,W,H).data;
   const points=[],glow=[];
   const x0=Math.max(0,Math.floor((W-width)/2-28)),x1=Math.min(W,Math.ceil((W+width)/2+28));
   const y0=Math.max(0,Math.floor(spec.y-size*.95-25)),y1=Math.min(H,Math.ceil(spec.y+size*.95+25));
   let row=0;
   for(let y=y0;y<y1;y+=step){
     let col=0;
     for(let x=x0;x<x1;x+=step){
       const ix=Math.round(x+step*.5),iy=Math.round(y+step*.5);
       if(ix>=W||iy>=H)continue;
       const idx=(iy*W+ix)*4+3;
       const a=core[idx]/255,h=halo[idx]/255;
       const point={x:ix,y:iy,a,u:clamp((ix-x0)/(x1-x0)),seed:rand(col,row,spec.start)};
       if(a>.18)points.push(point);
       else if(h>.018&&rand(col,row,88)>.31)glow.push({...point,a:h});
       col++;
     }
     row++;
   }
   messageParts.push({...spec,points,glow,step});
 }
}
function drawFinalMessage(t){
 if(t<15.5)return;
 const chars='01@#%<>/{}+*Σπ';
 for(const part of messageParts){
   const first=smooth(part.start,part.start+.22,t);
   if(first<=0)continue;
   ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.font=`700 ${part.step*1.15}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
   for(const p of part.glow){
     const reveal=smooth(part.start+p.u*.86,part.start+p.u*.86+.34,t);
     if(reveal<=0)continue;
     ctx.globalAlpha=clamp(p.a*reveal*(part.kind==='arrival'?3.0:1.5),0,.48);
     ctx.fillStyle=part.kind==='arrival'?'#d96e52':'#b98466';
     ctx.fillText(chars[Math.floor(p.seed*chars.length)],p.x,p.y);
   }
   for(const p of part.points){
     const reveal=smooth(part.start+p.u*.86,part.start+p.u*.86+.34,t);
     if(reveal<=0)continue;
     ctx.globalAlpha=clamp((.55+.45*p.a)*reveal,0,1);
     ctx.fillStyle=part.kind==='arrival'?(p.seed>.72?'#fff3df':'#ffd3ad'):'#f3d2b5';
     ctx.shadowBlur=part.kind==='arrival'&&p.seed>.62?5:2;
     ctx.shadowColor='#e17c5b';
     ctx.fillText(chars[Math.floor(p.seed*chars.length)],p.x,p.y);
   }
   ctx.restore();
 }
}
function updateTimelineUI(){
 if(elapsed<1.3)status.textContent='01 / AWAKENING';
 else if(elapsed<3.0)status.textContent='02 / SEARCHING';
 else if(elapsed<5.4)status.textContent='03 / STILL SEARCHING';
 else if(elapsed<6.35)status.textContent='04 / A BLINK';
 else if(elapsed<10.9)status.textContent='05 / CLOSER';
 else if(elapsed<16.4)status.textContent='06 / A HEART';
 else status.textContent='07 / FOR YOU';
 clock.textContent=`00:${String(Math.min(99,Math.floor(elapsed))).padStart(2,'0')}`;
}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){
   elapsed=Math.min(21.5,elapsed+dt);
   if(elapsed>=21.5){paused=true;lastRender=0}
 }
 // limit expensive glyph painting to ~30 FPS while keeping timeline continuous
 if(now-lastRender>30 && (!paused || lastRender===0)){
   lastRender=now;
   drawEyeASCII(elapsed);
   drawHeart(elapsed);
   drawFinalMessage(elapsed);
   updateTimelineUI();
   if(elapsed>=21.5)syncPauseButton();
 }
 requestAnimationFrame(frame);
}
function syncPauseButton(){
 const finished=elapsed>=21.5;
 btn.textContent=finished?'↻   Replay':paused?'▶   Resume':'Ⅱ   Pause';
 btn.setAttribute('aria-label',finished?'Replay animation':paused?'Resume animation':'Pause animation');
}
function replay(){elapsed=0;paused=false;syncPauseButton();updateTimelineUI();last=performance.now();lastRender=0}
btn.addEventListener('click',()=>{if(elapsed>=21.5)return replay();paused=!paused;syncPauseButton()});
document.querySelector('#replay').addEventListener('click',replay);
canvas.addEventListener('click',replay);
window.addEventListener('keydown',e=>{
 if(e.target instanceof HTMLButtonElement)return;
 if(e.code==='Space'){e.preventDefault();paused=!paused;syncPauseButton()}
 if(e.key.toLowerCase()==='r')replay();
});
window.addEventListener('resize',setup);
buildEye(false);buildEye(true);setup();syncPauseButton();requestAnimationFrame(frame);
// For deterministic inspection, without affecting ordinary viewers.
window.__previewTime=(t)=>{paused=true;elapsed=t;syncPauseButton();drawEyeASCII(elapsed);drawHeart(elapsed);drawFinalMessage(elapsed);updateTimelineUI()};
})();
</script>
