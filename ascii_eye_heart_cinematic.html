<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A small story told in code.">
<meta name="theme-color" content="#030504">
<meta property="og:type" content="website">
<meta property="og:title" content="Between Blinks">
<meta property="og:description" content="A small story told in code.">
<meta property="og:image" content="https://raw.githubusercontent.com/sabazaqaidze31-glitch/sagas-rose/main/preview.jpg">
<link rel="icon" href="data:,">
<title>Between Blinks</title>
<style>
:root{color-scheme:dark;--rose:#e7a887;--muted:#777986}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020207;overflow:hidden}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e6bcc7;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:#020504}
#scene{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#overlay{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 3px,rgba(0,0,0,.055) 4px);opacity:.42}
#top{pointer-events:none;position:absolute;top:clamp(16px,4vw,32px);left:clamp(16px,4vw,40px);right:clamp(16px,4vw,40px);display:flex;justify-content:space-between;align-items:center;color:rgba(240,196,162,.48);font-size:clamp(10px,1vw,12px);letter-spacing:.13em;text-shadow:0 0 12px rgba(226,112,59,.18)}
#top strong{font-weight:500;color:#e7b393}#label{opacity:.8}
#bottom{pointer-events:none;position:absolute;bottom:clamp(20px,4vw,36px);left:clamp(16px,4vw,40px);right:clamp(16px,4vw,40px);display:flex;justify-content:space-between;align-items:center;gap:10px}
#bottom span{font-size:clamp(10px,1vw,12px);letter-spacing:.1em;color:#8b746b}
.controls{pointer-events:auto;display:flex;gap:10px}
.controls button{background:rgba(6,9,9,.86);color:#e1ab8f;border:1px solid rgba(232,151,101,.3);border-radius:7px;padding:9px 14px;font-family:inherit;font-size:12px;letter-spacing:.03em;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.controls button:hover{color:white;border-color:#d59671;background:rgba(73,40,25,.65)}
@media (max-width:620px){#top{top:16px}#bottom{bottom:16px}#bottom span{max-width:42vw;font-size:9px}.controls button{padding:8px 10px;font-size:11px}#label{display:none}}
@media (prefers-reduced-motion:reduce){#overlay{display:none}}
</style>
</head>
<body>
<main id="stage">
  <canvas id="scene" role="img" aria-label="A helmet and a human eye made of code lead to a knight embracing a princess holding a bouquet in a castle garden. The message reads: You asked me where I’d gone… I’m here."></canvas>
  <div id="overlay"></div>
  <div id="top"><div><strong>✦</strong> &nbsp; B E T W E E N &nbsp; B L I N K S</div><div id="label"> <span id="clock">00:00</span></div></div>
  <div id="bottom"><span id="status">LOADING</span><div class="controls"><button id="toggle" disabled aria-label="Pause animation">Ⅱ &nbsp; Pause</button><button id="replay" disabled aria-label="Replay animation">↻ &nbsp; Replay</button></div></div>
</main>
<script src="assets/artwork.js"></script>
<script src="cinematic.js"></script>
</body>
</html>
