<script>
(() => {

const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});

// Curves use the same anatomy as the reference: almond eye, sclera, amber iris,

function eyePath(){

function upperCurve(){g.beginPath();g.moveTo(67,416);g.bezierCurveTo(241,329,425,246,681,246);g.bezierCurveTo(953,241,1188,318,1330,423)}

 let skin=g.createLinearGradient(0,192,0,412);

 // lower eyelid subtle pink underglow
 g.save();g.beginPath();g.moveTo(67,415);g.bezierCurveTo(367,673,951,767,1330,423);g.bezierCurveTo(984,675,335,695,67,415);g.fillStyle='rgba(155,54,68,.25)';g.fill();g.restore();
 // sclera, filled into eye aperture

 let scl=g.createRadialGradient(690,429,55,705,430,780);
 scl.addColorStop(0,'#e4e8df');scl.addColorStop(.32,'#d5dfdb');scl.addColorStop(.60,'#a8bcb8');scl.addColorStop(.78,'#687a79');scl.addColorStop(1,'#4a302e');
 g.fillStyle=scl;g.fillRect(0,0,REF_W,REF_H);
 // eyelid cast shadows: strong above + at outer corners
 let shade=g.createLinearGradient(0,242,0,425);
 shade.addColorStop(0,'rgba(25,4,13,.8)');shade.addColorStop(.24,'rgba(43,11,29,.52)');shade.addColorStop(.6,'rgba(43,24,38,0)');shade.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=shade;g.fillRect(60,235,1280,260);
 let bottomShade=g.createLinearGradient(0,530,0,650);
 bottomShade.addColorStop(0,'rgba(40,12,30,0)');bottomShade.addColorStop(1,'rgba(59,12,29,.6)');g.fillStyle=bottomShade;g.fillRect(65,530,1280,130);
 // delicate veins; faint enough to preserve white sclera
 for(let i=0;i<37;i++){
   const left=i<18;const x=left?90+rand(i,3)*375:950+rand(i,4)*300;
   const y=388+rand(i,5)*118;
   g.beginPath();g.moveTo(x,y);
   g.quadraticCurveTo(x+(left?40:-40),y-12,x+(left?75:-75),y+6);
   g.lineWidth=.7+rand(i,8)*.8;g.strokeStyle='rgba(155,72,88,.08)';g.stroke();
 }
 // iris: dark outer limbal ring and deep amber radial coloration
 const IX=697,IY=436,IR=220;
 let rim=g.createRadialGradient(IX,IY,60,IX,IY,IR+14);
 rim.addColorStop(0,'#060705');rim.addColorStop(.38,'#512a17');rim.addColorStop(.52,'#9d582a');rim.addColorStop(.67,'#d18a4c');rim.addColorStop(.80,'#9b542d');rim.addColorStop(.93,'#44271d');rim.addColorStop(1,'#10100d');
 g.fillStyle=rim;g.beginPath();g.arc(IX,IY,IR+7,0,2*PI);g.fill();
 g.save();g.beginPath();g.arc(IX,IY,IR-4,0,2*PI);g.clip();
 // radial iris fibres (gold, deep brown and copper; 360 distinct striations)
 for(let j=0;j<420;j++){
   let a=2*PI*j/420,noise=rand(j,4),r1=100+noise*25,r2=IR-6-rand(j,5)*16;
   const x1=IX+Math.cos(a)*r1,y1=IY+Math.sin(a)*r1;
   const x2=IX+Math.cos(a+.015*Math.sin(j*2.3))*r2,y2=IY+Math.sin(a+.015*Math.sin(j*2.3))*r2;
   g.beginPath();g.moveTo(x1,y1);
   g.quadraticCurveTo(IX+Math.cos(a+.012)*((r1+r2)/2),IY+Math.sin(a+.012)*((r1+r2)/2),x2,y2);
   const gold=j%3===0;
   g.strokeStyle=gold?`rgba(255,211,133,${.24+rand(j,8)*.48})`:`rgba(15,7,9,${.15+rand(j,9)*.45})`;
   g.lineWidth=gold?1.5+rand(j,2)*2.4:1.0+rand(j,3)*4.5;g.stroke();
 }
 // colored irregular collarette around pupil
 g.beginPath();for(let j=0;j<=280;j++){
   let a=j/280*2*PI;
   const r=124+Math.sin(a*13)*5+Math.sin(a*31+2)*3;
   const x=IX+Math.cos(a)*r,y=IY+Math.sin(a)*r;
   if(j===0)g.moveTo(x,y);else g.lineTo(x,y);
 }g.closePath();g.lineWidth=13;g.strokeStyle='rgba(213,133,68,.50)';g.stroke();
 // diffuse warm inner rim and very dark pupil
 let pupilGlow=g.createRadialGradient(IX,IY,75,IX,IY,128);
 pupilGlow.addColorStop(0,'#080609');pupilGlow.addColorStop(.63,'#10080a');pupilGlow.addColorStop(.82,'rgba(63,28,24,.88)');pupilGlow.addColorStop(1,'rgba(80,41,24,0)');
 g.fillStyle=pupilGlow;g.beginPath();g.arc(IX,IY,128,0,2*PI);g.fill();
 g.beginPath();g.arc(IX,IY,100,0,2*PI);g.fillStyle='#060408';g.fill();
 // small reflective light catches: not a photo overlay, sampled later as glyphs
 let reflection=g.createRadialGradient(648,356,2,648,356,53);
 reflection.addColorStop(0,'rgba(255,251,231,.98)');reflection.addColorStop(.4,'rgba(249,233,215,.84)');reflection.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=reflection;g.beginPath();g.ellipse(649,356,37,18,-.5,0,2*PI);g.fill();
 g.fillStyle='rgba(255,238,210,.74)';g.beginPath();g.ellipse(743,498,15,8,.3,0,2*PI);g.fill();
 g.restore(); // iris clip
 g.restore(); // sclera eye clip
 // layered eyelid contour with soft glow, all as pixel map
 upperCurve();strokeLine(27,'rgba(28,13,10,.82)',12,'rgba(223,113,63,.25)');
 upperCurve();strokeLine(12,'rgba(129,64,45,.94)',9,'rgba(231,128,70,.42)');
 upperCurve();strokeLine(3.5,'rgba(225,159,114,.67)',6,'rgba(234,129,70,.45)');
 lowerCurve();strokeLine(22,'rgba(52,24,19,.77)',11,'rgba(182,77,43,.27)');
 lowerCurve();strokeLine(9,'rgba(170,94,69,.72)',9,'rgba(211,113,74,.24)');
 lowerCurve();strokeLine(2.3,'rgba(223,165,130,.46)',4,'rgba(230,116,73,.24)');
 // eyelash tufts at the outer corners: understated
 for(let i=0;i<16;i++){
   let a=i/15, x=1070+243*a,y=314+92*a;
   g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+14+20*a,y-23-10*a,x+27+19*a,y-28-23*a);
   g.strokeStyle=`rgba(121,48,72,${.30+ .24*a})`;g.lineWidth=2.5+i*.03;g.stroke();
 }
 for(let i=0;i<9;i++){
   let a=i/8,x=108+150*a,y=393-69*a;
   g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-22,y-17,x-31,y-22);
   g.strokeStyle='rgba(116,50,73,.3)';g.lineWidth=2;g.stroke();
 }

}
const codeLines=[
 'def render(upper, dx, dy):    x = np.array([0.52, 0.48, 0.29], np.float32)     # luminance',
 'for row in range(height):    shade = sample(x, y)    mask = iris > pupil     return glyphs[row]',
 'if 0.10 < glow < 0.72:    color = (amber, ivory, cyan)    canvas.fillText(char, x, y)',
 'texture = np.sin(theta * 31.0 + radius * 0.26)   # contour / shadow / reflect',
 'while frame < duration:    draw_eye(t)    light = smoothstep(.04, .98, intensity)',
 'pixels[y, x] = np.clip(source * exposure + grain, 0, 255)    // vision / memory',
 'const iris = radialGradient(cx, cy, pupil, limbus);  let luminance = dot(rgb, weights);'
];
function buildCodeBackground(){
 codeCanvas.width=Math.round(W*DPR);codeCanvas.height=Math.round(H*DPR);
 bg.setTransform(DPR,0,0,DPR,0,0);
 bg.fillStyle='#030504';bg.fillRect(0,0,W,H);
 const size=clamp(W/95,10,13),lineH=size*1.36;
 bg.font=`500 ${size}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 bg.textAlign='left';bg.textBaseline='middle';
 const rows=Math.ceil(H/lineH)+1;
 for(let row=0;row<rows;row++){
   const y=row*lineH+3,seed=Math.floor(rand(row,20)*codeLines.length);
   const s=(codeLines[seed]+'   '+codeLines[(seed+3)%codeLines.length]+'   '+codeLines[(seed+5)%codeLines.length]);
   const shift=-rand(row,18)*size*22;
   const zone=Math.abs(y-H*.50)/H;
   bg.globalAlpha=zone<.30?.22:.36;
   bg.fillStyle=row%6===0?'#8da7a2':row%4===0?'#b26a48':'#8a7770';
   bg.fillText(s,shift,y);
   if(row%5===0){
     bg.globalAlpha=.11;bg.fillStyle='#e5ae82';bg.fillText(s,shift+size*.18,y+1);
   }
 }
 bg.globalAlpha=1;
 // A dark eye socket keeps the code visible at the edges but gives the iris depth.
 const socket=bg.createRadialGradient(W*.5,H*.50,Math.min(W,H)*.10,W*.5,H*.50,Math.max(W*.70,H*.55));
 socket.addColorStop(0,'rgba(0,0,0,.38)');socket.addColorStop(.48,'rgba(0,0,0,.15)');socket.addColorStop(1,'rgba(0,0,0,.70)');
 bg.fillStyle=socket;bg.fillRect(0,0,W,H);
}
function setup(){
 DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
 buildCodeBackground();
 // Fill the frame as in the reference; cropping at the corners is intentional.
 const aspect=REF_W/REF_H;
 drawW=Math.max(W*1.30,Math.min(H*.92*aspect,W*2.2));
 drawH=drawW/aspect;
 offsetX=(W-drawW)/2;offsetY=(H-drawH)/2;
 COLS= Math.min(166,Math.max(105,Math.round(drawW/8.7)));
 ROWS= Math.round(COLS*(REF_H/REF_W)*.94);
 cellW=drawW/COLS;cellH=drawH/ROWS;
 fontSize=Math.min(cellH*1.17,cellW*1.6);
 stars=[];
 for(let i=0;i<Math.max(36,Math.round(W*H/16000));i++){
   stars.push({x:rand(i,1)*W,y:rand(i,2)*H,r:.3+rand(i,3)*1.0,a:.15+rand(i,4)*.45,phase:rand(i,5)*6.28});
 }
 lastRender=0;
}
function glyph(c,r,luma){
 const mixKey=rand(c+18,r+41);
 const bright='@#MW80QBX%';
 const medium='0A8B37ΣπψΩ<>/%&$#';
 const dim='1|/\\(){}=+*;:·.-';
 let set=(luma>.67)?bright:(luma>.34)?medium:dim;
 return set[Math.floor(mixKey*set.length)];
}
function sample(sx,sy){
 let x=sx|0,y=sy|0;
 if(x<0||y<0||x>=REF_W||y>=REF_H)return null;
 const idx=(y*REF_W+x)*4;return [pixel[idx],pixel[idx+1],pixel[idx+2],pixel[idx+3]];
}
function drawBackground(t,zoom){
 ctx.drawImage(codeCanvas,0,0,W,H);
 // Fine dust over the terminal texture.
 for(const s of stars){
   let a=s.a*(.62+.38*Math.sin(t*.75+s.phase));
   if(zoom>3)a*=clamp((7-zoom)/4);
   ctx.globalAlpha=Math.max(0,a*.35);ctx.fillStyle='#e8c4a1';
   ctx.fillRect(s.x,s.y,s.r,s.r);

 let hg=ctx.createRadialGradient(W*.5,H*.49,15,W*.5,H*.49,Math.max(drawW*.67,80));

}
function drawEyeASCII(t){
 // Hold the full eye long enough to study it, then travel through the pupil.
 const p=smooth(5.5,10.2,t);const zoom=mix(1.0,9.6,ease(p));
 drawBackground(t,zoom);
 // The source pupil is nearly black; keep the terminal text behind it in shadow.
 const pupilX=offsetX+(CX+(697-CX)*zoom)/REF_W*drawW;
 const pupilY=offsetY+(CY+(436-CY)*zoom)/REF_H*drawH;
 const pupilR=108*zoom*drawW/REF_W;
 const pupilShade=ctx.createRadialGradient(pupilX,pupilY,pupilR*.25,pupilX,pupilY,pupilR*1.45);
 pupilShade.addColorStop(0,'rgba(0,0,0,.98)');
 pupilShade.addColorStop(.72,'rgba(0,0,0,.96)');
 pupilShade.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=pupilShade;ctx.fillRect(0,0,W,H);
 const eyeFading=1-smooth(9.7,11.0,t);
 const cellL=cellW,cellT=cellH;
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${fontSize}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 for(let r=0;r<ROWS;r++){
   const y=offsetY+(r+.5)*cellT;
   for(let c=0;c<COLS;c++){
     // stable world-grid character positions when zoomed; density stays crisp rather than scaling a raster screenshot
     const x=offsetX+(c+.5)*cellL;
     let sx=CX+(((c+.5)/COLS)*REF_W-CX)/zoom;
     let sy=CY+(((r+.5)/ROWS)*REF_H-CY)/zoom;
     const sample0=sample(sx,sy);
     if(!sample0 || sample0[3]<30)continue;
     const [rr,gg,bb,aa]=sample0;
     const alpha=aa/255;
     const luma=(.2126*rr+.7152*gg+.0722*bb)/255;
     const rnd=rand(c,r,7);
     // character-column reveal; after 1.8s full stable eye
     const revealLine=smooth(0,2.0,t+((c-COLS*.5)/COLS)*.18 + .2*(rnd-.5));
     const factor=alpha*(.78 +.22*luma)*revealLine*eyeFading;
     if(factor<.07 || rand(c,r,9)>(.08+.94*factor))continue;

     const colorG=Math.round(gg);const colorB=Math.round(bb);

     ctx.fillStyle=`rgb(${colorR},${colorG},${colorB})`;

   }
 }
 ctx.shadowBlur=0;ctx.globalAlpha=1;
 // tiny warm iris inner rim persists briefly as the pupil fills screen
 if(t>8.6&&t<11.1){
   const portal=smooth(8.6,10.2,t)*(1-smooth(10.2,11.1,t));
   const gr=ctx.createRadialGradient(W/2,H/2,2,W/2,H/2,Math.min(W,H)*.4);
   gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.85,`rgba(80,18,39,${portal*.06})`);gr.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 }
}
function heartVal(x,y){let a=x*x+y*y-1;return a*a*a-x*x*y*y*y}
function drawHeart(t){
 let appearance=smooth(8.4,11.8,t);
 if(appearance<.002)return;
 const pulse=1+.025*Math.sin((t-8.0)*3.1)*smooth(8.0,9.3,t);
 const size=Math.min(drawW*.245,drawH*.48,268)*(.08+.92*ease(appearance))*pulse;
 // offsets chosen so mathematical heart's visual centroid is actually centered
 const hx=W/2,hy=H/2+Math.min(38,drawH*.025);
 // still ASCII: glow below belongs to each glyph, not to a vector heart layer
 let glow=ctx.createRadialGradient(hx,hy,15,hx,hy,size*1.50);
 glow.addColorStop(0,`rgba(240,50,92,${appearance*.13})`);
 glow.addColorStop(.4,`rgba(195,20,65,${appearance*.08})`);
 glow.addColorStop(1,'rgba(150,0,40,0)');
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${fontSize*1.05}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 for(let r=0;r<ROWS;r++){
   const y=offsetY+(r+.5)*cellH;
   const yy=(hy-y)/size;
   if(Math.abs(yy)>1.36)continue;
   for(let c=0;c<COLS;c++){
     const x=offsetX+(c+.5)*cellW;
     const xx=(x-hx)/size;
     if(Math.abs(xx)>1.2)continue;
     const f=heartVal(xx,yy);
     if(f>0)continue;
     const edge=clamp(-f*32,0,1);
     const highlight=Math.exp(-((xx+.42)**2/.09 + (yy-.42)**2/.12));
     const soft=Math.exp(-((xx+.1)**2/.8+(yy-.25)**2/.8));
     const stripe=Math.sin((xx+yy)*16)*.04;
     const lum=clamp(.42 +.30*(yy+.9)/2.2 + .35*highlight+.14*soft+stripe);
     const R=255, G=Math.round(mix(30,191,highlight*.77 +.19*soft)), B=Math.round(mix(68,180,highlight*.64+.13*soft));
     const alp=clamp((.65+.34*edge)*appearance*(.82+ .18*rand(c,r,27)));
     if(rand(c,r,19)>.27+.73*alp)continue;
     ctx.fillStyle=`rgb(${R},${G},${B})`;ctx.globalAlpha=alp;
     if(highlight>.32|| (edge<.65&&rand(c,r,1)>.6)){
       ctx.shadowBlur=8;ctx.shadowColor='rgba(255,67,112,.8)';
     }else ctx.shadowBlur=0;
     const chars= lum>.67?'@#MW880$':lum>.5?'8BXΣπΩ%&0': '0A4/<>+*=';
     const ch=chars[(rand(c,r,41)*chars.length)|0];
     ctx.fillText(ch,x,y);
   }
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 // a few glints, also composed of terminal characters
 const glint=smooth(8.2,9.3,t);
 if(glint>.02){
   const glints=[[-.42,.44,'+'],[.34,.34,'×'],[-.57,-.1,'·'],[.54,-.36,'*']];
   for(let i=0;i<glints.length;i++){
     const [gx,gy,s]=glints[i];
     const twinkle=(.52+.48*Math.sin(3.9*t+i*1.7))*glint;
     ctx.fillStyle=`rgba(255,219,228,${twinkle*.86})`;
     ctx.font=`700 ${fontSize*1.5}px monospace`;
     ctx.shadowBlur=9;ctx.shadowColor='rgba(255,120,170,.75)';
     ctx.fillText(s,hx+gx*size*1.4,hy+gy*size*1.6);
   }
   ctx.shadowBlur=0;
 }
}
function updateTimelineUI(){
 if(elapsed<5.5)status.textContent='01 / THE EYE';
 else if(elapsed<10.2)status.textContent='02 / INTO THE PUPIL';
 else status.textContent='03 / THE HEART';
 clock.textContent=`00:${String(Math.min(99,Math.floor(elapsed))).padStart(2,'0')}`;
}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)elapsed+=dt;
 // limit expensive glyph painting to ~30 FPS while keeping timeline continuous
 if(now-lastRender>30 && (!paused || lastRender===0)){
   lastRender=now;
   drawEyeASCII(elapsed);
   drawHeart(elapsed);
   updateTimelineUI();
 }
 requestAnimationFrame(frame);
}
function syncPauseButton(){btn.textContent=paused?'▶   გაგრძელება':'Ⅱ   პაუზა';btn.setAttribute('aria-label',paused?'გაგრძელება':'შეჩერება')}
function replay(){elapsed=0;paused=false;syncPauseButton();last=performance.now();lastRender=0}
btn.addEventListener('click',()=>{paused=!paused;syncPauseButton()});
document.querySelector('#replay').addEventListener('click',replay);
canvas.addEventListener('click',replay);
window.addEventListener('keydown',e=>{
 if(e.target instanceof HTMLButtonElement)return;
 if(e.code==='Space'){e.preventDefault();paused=!paused;syncPauseButton()}
 if(e.key.toLowerCase()==='r')replay();
});
window.addEventListener('resize',setup);
buildEye();setup();syncPauseButton();requestAnimationFrame(frame);
// For deterministic inspection, without affecting ordinary viewers.
window.__previewTime=(t)=>{paused=true;elapsed=t;syncPauseButton();drawEyeASCII(elapsed);drawHeart(elapsed);updateTimelineUI()};
})();
</script>
